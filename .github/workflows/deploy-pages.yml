# 部署到 GitHub Pages（纯静态，无需构建）
#
# 使用方式：
#   1. 把本仓库推到 GitHub
#   2. 仓库 Settings → Pages → Source 选择 “GitHub Actions”
#   3. 之后每次 push 到 main 分支都会自动发布
#
# 访问地址：https://<你的用户名>.github.io/<仓库名>/
# 也可以绑定自定义域名（Settings → Pages → Custom domain）
#
# 说明：本项目零依赖、零构建，Pages 直接发布仓库根目录即可；
#      所有资源都用相对路径引用，因此在子路径（/仓库名/）下也能正常工作。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: 自测（题库与判分引擎）
        run: node scripts/check.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
